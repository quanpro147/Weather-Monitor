name: Daily Weather Fetch

on:
  schedule:
    - cron: '0 0 * * *'   # mỗi ngày lúc 00:00 UTC
  workflow_dispatch:        # nút chạy thủ công trên GitHub UI

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false           # 1 shard lỗi không hủy các shard còn lại
      matrix:
        shard: [0, 1, 2, 3, 4, 5]
    defaults:
      run:
        working-directory: data-pipeline/fetchers

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: data-pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r ../requirements.txt

      - name: Fetch weather data (shard ${{ matrix.shard }}/6)
        run: python main.py
        env:
          RUN_MODE: fetch
          SHARD_INDEX: ${{ matrix.shard }}
          SHARD_COUNT: 6
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

  clean:
    needs: fetch                  # chạy sau khi tất cả shard fetch xong
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: data-pipeline/fetchers

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: data-pipeline/requirements.txt

      - name: Install dependencies
        run: pip install -r ../requirements.txt

      - name: Clean weather data
        run: python main.py
        env:
          RUN_MODE: clean
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
